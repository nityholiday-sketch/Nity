# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # --- APP CONFIG ---
  - variable: NEXT_PUBLIC_APP_URL
    value: https://nityholiday.com
    availability:
      - BUILD
      - RUNTIME

  # --- CCAVENUE PAYMENT GATEWAY ---
  - variable: CCAVENUE_MERCHANT_ID
    value: "4394334"
    availability:
      - RUNTIME

  - variable: CCAVENUE_ACCESS_CODE
    value: "AVCU82MG22BA07UCAB"
    availability:
      - RUNTIME

  - variable: CCAVENUE_WORKING_KEY
    value: "838ACE370BB450A254AE3FF02355588F"
    availability:
      - RUNTIME

  # --- FIREBASE CONFIG ---
  - variable: MY_FIREBASE_PROJECT_ID
    value: nityholiday-adventures
    availability:
      - RUNTIME

  - variable: MY_FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@nityholiday-adventures.iam.gserviceaccount.com
    availability:
      - RUNTIME

  - variable: MY_FIREBASE_PRIVATE_KEY
    secret: MY_FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
