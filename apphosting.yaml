# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # --- APP CONFIG ---
  - variable: NEXT_PUBLIC_APP_URL
    value: https://nityholiday.com
    availability:
      - BUILD
      - RUNTIME

  # --- PAYGLOCAL PAYMENT GATEWAY ---
  - variable: PAYGLOCAL_MERCHANT_ID
    value: "nityholiday"
    availability:
      - RUNTIME

  - variable: PAYGLOCAL_ENV
    value: "production"
    availability:
      - RUNTIME

  - variable: PAYGLOCAL_KEY_ID
    value: ""
    availability:
      - RUNTIME

  - variable: PAYGLOCAL_PRIVATE_KEY
    value: ""
    availability:
      - RUNTIME

  - variable: PAYGLOCAL_PUBLIC_KEY_ID
